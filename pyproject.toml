[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "trainforensics"
version = "0.1.0"
description = "Read a model's training history (tokens seen, LR schedule, steps, document order) from its embedding rows"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Bojie Li"}]
keywords = ["llm", "forensics", "adam", "adamw", "fine-tuning", "membership-inference", "open-weights", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = ["torch>=2.1", "numpy", "scipy", "safetensors", "requests", "huggingface_hub>=0.20", "tokenizers", "pyyaml"]

[project.optional-dependencies]
controlled = ["transformers>=4.45,<5", "accelerate", "datasets", "peft"]
# published-data audits, token mining, LIMO/Arete checks (tokenizers + datasets + sympy)
audits = ["transformers>=4.45,<5", "datasets", "sympy"]
figures = ["matplotlib"]
quant = ["gguf"]
# training-stack tests (scripts/stacks); DeepSpeed needs a CUDA toolkit (CUDA_HOME)
stacks = ["deepspeed>=0.15"]
# exact LIMO retokenization uses LIMO's vendored LLaMA-Factory (see REPRODUCE.md), not a PyPI release
llamafactory = ["llamafactory"]
test = ["pytest"]
all = ["transformers>=4.45,<5", "accelerate", "datasets", "peft", "sympy", "matplotlib", "gguf", "pytest"]

[project.urls]
Homepage = "https://github.com/bojieli/training-forensics"
"Sibling project" = "https://github.com/bojieli/checkpoint-forensics"

[tool.setuptools]
packages = ["trainforensics"]
